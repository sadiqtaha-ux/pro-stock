{% comment %}
Carte pour la vue Kanban Emplacement.
{% endcomment %}
<div class="card kanban-card border shadow-sm" onclick="location.href='{% url 'magasin:plan' %}?focus={{ emp.code }}'">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="fs-12 fw-bold text-dark">{{ emp.code }}</span>
            <span class="badge bg-light text-muted border fs-9 fw-normal">{{ emp.rayon.zone.code }}</span>
        </div>
        
        <div class="mb-2">
            <div class="d-flex align-items-center mb-1">
                <i class="bi bi-layers fs-11 text-muted me-2"></i>
                <span class="fs-11 text-muted">Rayon: {{ emp.rayon.code }}</span>
            </div>
            <div class="d-flex align-items-center mb-1">
                <i class="bi bi-grid-1x2 fs-11 text-muted me-2"></i>
                <span class="fs-11 text-muted">Niv: {{ emp.niveau }} / Col: {{ emp.colonne }}</span>
            </div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
            <small class="text-muted fs-10">Capacité: {{ emp.capacite_poids_max|default:"—" }} kg</small>
            <span class="btn btn-xs btn-white border p-1" title="Voir sur le plan"><i class="bi bi-geo-alt fs-10"></i></span>
        </div>
    </div>
</div>
