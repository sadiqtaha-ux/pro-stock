{% comment %}
Carte pour la vue Kanban Notification.
{% endcomment %}
<div class="card kanban-card border shadow-sm {% if not n.lue %}unread{% endif %}" 
     onclick="location.href='{% url 'core:notification-lue' n.pk %}'">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="fs-10 text-muted fw-bold">{{ n.date_envoi|timesince }}</span>
            <span class="badge {% if n.priorite == 'HAUTE' %}bg-danger{% elif n.priorite == 'NORMALE' %}bg-primary{% else %}bg-secondary{% endif %} fs-9 fw-normal">
                {{ n.get_priorite_display }}
            </span>
        </div>
        
        <h6 class="card-title mb-1 fs-13 fw-bold">{{ n.titre }}</h6>
        <p class="card-text mb-2 fs-11 text-muted">
            {{ n.message|truncatechars:120 }}
        </p>
        
        {% if not n.lue %}
        <div class="d-flex justify-content-end mt-2 pt-2 border-top">
            <span class="fs-10 text-primary fw-bold"><i class="bi bi-eye me-1"></i>Marquer lu</span>
        </div>
        {% endif %}
    </div>
</div>
