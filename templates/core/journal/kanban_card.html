{% comment %}
Carte pour la vue Kanban Journal d'Activité.
{% endcomment %}
<div class="card kanban-card border shadow-sm">
    <div class="card-body p-3">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="fs-10 text-muted fw-bold">{{ log.date_action|date:"d/m H:i" }}</span>
            <span class="badge bg-light text-muted border fs-9 fw-normal">{{ log.modele }}</span>
        </div>
        
        <p class="card-text mb-2 fs-12 text-dark">
            {{ log.description|truncatechars:100 }}
        </p>
        
        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
            <div class="d-flex align-items-center">
                <div class="rounded-circle bg-primary-soft text-primary d-flex align-items-center justify-content-center fw-bold fs-10 me-1" style="width:18px; height:18px;">
                    {{ log.utilisateur.username|first|upper }}
                </div>
                <span class="fs-10 text-muted">{{ log.utilisateur.username }}</span>
            </div>
            <span class="fs-10 text-muted">{{ log.adresse_ip|default:"—" }}</span>
        </div>
    </div>
</div>
