<div class="d-flex align-items-center gap-0 mb-4">
  {% for i in step_range %}
  <div class="d-flex align-items-center {% if not forloop.last %}flex-grow-1{% endif %}">
    <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold"
         style="width:32px;height:32px;flex-shrink:0;
                background:{% if i <= step %}#0d6efd{% else %}#dee2e6{% endif %};
                color:{% if i <= step %}white{% else %}#6c757d{% endif %};">
      {% if i < step %}<i class="bi bi-check"></i>{% else %}{{ i }}{% endif %}
    </div>
    {% if not forloop.last %}
    <div class="flex-grow-1 mx-1"
         style="height:2px;background:{% if i < step %}#0d6efd{% else %}#dee2e6{% endif %};"></div>
    {% endif %}
  </div>
  {% endfor %}
</div>
