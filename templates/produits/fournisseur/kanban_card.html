{% comment %}
Carte pour la vue Kanban Fournisseur.
{% endcomment %}
<div class="card kanban-card border shadow-sm" onclick="location.href='{% url 'produits:fournisseur-update' fournisseur.pk %}'">
    <div class="card-body p-3">
        <h6 class="card-title mb-2 fs-14 fw-bold">{{ fournisseur.nom }}</h6>
        
        <div class="mb-2">
            <div class="d-flex align-items-center mb-1">
                <i class="bi bi-person fs-11 text-muted me-2"></i>
                <span class="fs-11 text-muted">{{ fournisseur.contact|default:"—" }}</span>
            </div>
            <div class="d-flex align-items-center mb-1">
                <i class="bi bi-geo-alt fs-11 text-muted me-2"></i>
                <span class="fs-11 text-muted">{{ fournisseur.ville|default:"—" }}, {{ fournisseur.pays }}</span>
            </div>
        </div>
        
        <div class="d-flex justify-content-between align-items-center mt-2 pt-2 border-top">
            <span class="badge bg-secondary-soft text-secondary fs-10">
                {{ fournisseur.matieres.count }} matières
            </span>
            <div class="btn-group">
                <a href="mailto:{{ fournisseur.email }}" class="btn btn-xs btn-light border" title="Email">
                    <i class="bi bi-envelope fs-10"></i>
                </a>
            </div>
        </div>
    </div>
</div>
